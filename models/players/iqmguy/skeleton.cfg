// iqmguy: one skeletal model for the whole player (cg_oax_skel.c).
// The IQM is Z-up and faces +y, 9.2 units tall with its feet at 0.
model models/players/iqmguy/body.iqm
skin models/players/iqmguy/body_default.skin
scale 6.1                 // 9.2 IQM units -> 56 Quake units
yaw -90                   // the model faces +y; Quake players face +x
origin 0 0 -24            // feet at the bottom of the player box
swingaxis 1 0 0           // model axis a limb swings forward about (+ = forward)
// joints the procedural animation drives
role pelvis body
role spine body
role head head
role arm_l arm_L
role arm_r arm_r
role leg_l leg_L
role leg_r leg_R
role hand_r arm_r.001     // the weapon goes here
armdrop 55                // degrees the T-pose arms come down (they start at the spine)
// the IQM's own animations: name first count fps
anim dance 61 61 24       // TORSO_GESTURE
anim jump 0 61 48         // LEGS_JUMP
// ragdoll bones, one capsule each: bone <joint> <tail> <radius> <parent bone | -> <cone> <twist lo> <twist hi>
// tail: a joint, or len:<n> along the joint's bone axis (+y); IQM units (scaled with
// the model), angles in degrees. Joints that are not bones follow the bone
// above them (or the first bone).
bone body neck 1.3 - 0 0 0
bone head len:2.0 1.1 body 35 -40 40
bone arm_L arm_L.001 0.55 body 80 -60 60
bone arm_r arm_r.001 0.55 body 80 -60 60
bone leg_L leg_L.001 0.65 body 70 -30 30
bone leg_R leg_R.001 0.65 body 70 -30 30
